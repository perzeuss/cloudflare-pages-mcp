# Self-hosting with Docker Compose.
#
#   1. cp .env.example .env   # then fill in the Cloudflare credentials etc.
#   2. docker compose up -d --build
#
# Put this service behind a reverse proxy (Caddy, nginx, Traefik, ...) that
# terminates TLS, and set PUBLIC_BASE_URL to the public https URL so Claude can
# reach the connector over HTTPS.

services:
  cloudflare-pages-mcp:
    # Build locally, or comment out `build:` and use the prebuilt image below.
    build:
      context: .
      dockerfile: Dockerfile
    image: cloudflare-pages-mcp:latest
    # Prebuilt multi-arch image (remove the `build:` block above to use it):
    # image: ghcr.io/perzeuss/cloudflare-pages-mcp:latest
    restart: unless-stopped
    # Behind a reverse proxy on the same Docker network, no host port needs to
    # be published — the proxy reaches this service directly as
    # `cloudflare-pages-mcp:3000`. `expose` is documentation only and never
    # binds a host port, so it cannot collide with something already on the host.
    expose:
      - "3000"
    # To reach the server directly from the host (e.g. local testing without a
    # proxy), uncomment this and set HOST_PORT to a free port. Avoid 3000 if it
    # is already allocated:
    #   HOST_PORT=8787 docker compose up -d
    # ports:
    #   - "${HOST_PORT:-3000}:3000"
    environment:
      # --- Required: Cloudflare credentials --------------------------------
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:?set CLOUDFLARE_API_TOKEN}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:?set CLOUDFLARE_ACCOUNT_ID}

      # --- Server ----------------------------------------------------------
      PORT: ${PORT:-3000}
      HOST: ${HOST:-0.0.0.0}
      # Public URL this server is reachable at (also the default OAuth issuer).
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}

      # --- Auth: static token (simple) -------------------------------------
      # If set, every POST /mcp must send "Authorization: Bearer <token>".
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-}

      # --- Auth: OAuth 2.1 (required for a Claude custom connector) ---------
      # Set OAUTH_PASSWORD to enable the built-in OAuth 2.1 server. Point
      # OAUTH_ISSUER_URL (or PUBLIC_BASE_URL) at this server's public https URL.
      OAUTH_PASSWORD: ${OAUTH_PASSWORD:-}
      OAUTH_ISSUER_URL: ${OAUTH_ISSUER_URL:-}
      OAUTH_SIGNING_SECRET: ${OAUTH_SIGNING_SECRET:-}
      OAUTH_ACCESS_TOKEN_TTL: ${OAUTH_ACCESS_TOKEN_TTL:-3600}
      OAUTH_REFRESH_TOKEN_TTL: ${OAUTH_REFRESH_TOKEN_TTL:-2592000}

      # --- Hardening (optional) --------------------------------------------
      TRUST_PROXY: ${TRUST_PROXY:-1}
      MAX_BODY_SIZE: ${MAX_BODY_SIZE:-25mb}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-60}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
